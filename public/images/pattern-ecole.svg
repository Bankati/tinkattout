  <rect width="800" height="800" fill="url(#grid)"/>

  <!-- Tous les éléments en bleu contour, stroke only -->
  <g fill="none" stroke="#3FAEE8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    <!-- ══ CRAYONS ══ -->
    <!-- Crayon 1 — haut gauche, penché -->
    <g transform="translate(78,110) rotate(-50)">
      <rect x="-6" y="-32" width="12" height="58" rx="1.5"/>
      <polygon points="-6,26 6,26 0,42" stroke-width="2"/>
      <rect x="-6" y="-42" width="12" height="12" rx="1"/>
      <line x1="-6" y1="-30" x2="6" y2="-30"/>
      <line x1="-6" y1="26" x2="6" y2="26"/>
    </g>

    <!-- Crayon 2 — haut milieu, droit -->
    <g transform="translate(315,55) rotate(20)">
      <rect x="-6" y="-32" width="12" height="58" rx="1.5"/>
      <polygon points="-6,26 6,26 0,42"/>
      <rect x="-6" y="-42" width="12" height="12" rx="1"/>
      <line x1="-6" y1="-30" x2="6" y2="-30"/>
      <line x1="-6" y1="26" x2="6" y2="26"/>
    </g>

    <!-- Crayon 3 — milieu gauche -->
