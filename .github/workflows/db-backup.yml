# Sauvegarde hebdomadaire de la base PostgreSQL (Supabase) de l'École Tinka-Tout.
#
# PREMIÈRE ÉTAPE SEULEMENT : le fichier chiffré est gardé 30 jours comme artefact GitHub.
# Si GitHub ou le dépôt devient inaccessible, ces sauvegardes le sont aussi.
# Un stockage hors GitHub (second compte cloud, disque de l'école...) reste à décider.
#
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   DATABASE_BACKUP_URL  URL du pooler Supabase en mode SESSION (port 5432), avec ?sslmode=require.
#                        Pas le port 6543 (mode transaction) ; pas l'hôte direct db.<ref>.supabase.co
#                        (IPv6 seulement, injoignable depuis les machines GitHub).
#   BACKUP_PASSPHRASE    phrase de chiffrement (longue, aléatoire), rangée AUSSI hors de GitHub :
#                        sans elle, les sauvegardes sont illisibles.
#
# Restauration : voir README.md, section « Sauvegarde et restauration ».
# Les tâches planifiées ne tournent que depuis la branche par défaut (main).

name: Sauvegarde base de données

on:
  schedule:
    # Chaque dimanche à 02:00 UTC (02:00 à Lomé).
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PG_MAJOR: "17"
    steps:
      - name: Vérifier les secrets
        env:
          DATABASE_BACKUP_URL: ${{ secrets.DATABASE_BACKUP_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=0
          if [ -z "$DATABASE_BACKUP_URL" ]; then echo "::error::Secret DATABASE_BACKUP_URL absent : aucune sauvegarde faite."; missing=1; fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "::error::Secret BACKUP_PASSPHRASE absent : aucune sauvegarde faite."; missing=1; fi
          exit "$missing"

      # pg_dump doit être au moins de la version du serveur : la version 17 sauvegarde
      # un serveur Supabase en Postgres 15 comme en Postgres 17.
      - name: Installer le client PostgreSQL ${{ env.PG_MAJOR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Sauvegarder (pg_dump)
        env:
          DATABASE_BACKUP_URL: ${{ secrets.DATABASE_BACKUP_URL }}
        run: |
          set -euo pipefail
          pg_dump --version
          echo "Serveur : $(psql "$DATABASE_BACKUP_URL" -XAtc 'show server_version')"
          mkdir -p "$RUNNER_TEMP/backup"
          # Format custom (restaurable avec pg_restore), schéma public seulement
          # (les 4 tables de l'application ; les schémas internes de Supabase sont exclus).
          pg_dump "$DATABASE_BACKUP_URL" \
            --format=custom \
            --schema=public \
            --no-owner \
            --no-privileges \
            --file="$RUNNER_TEMP/backup/tinkattout.dump"
          # Contrôle : le fichier doit être lisible et contenir les 4 tables.
          pg_restore --list "$RUNNER_TEMP/backup/tinkattout.dump" > "$RUNNER_TEMP/backup/list.txt"
          for t in Contact Registration Admin News; do
            grep -q "TABLE DATA public \"\?${t}\"\? " "$RUNNER_TEMP/backup/list.txt" \
              || { echo "::error::Table ${t} absente de la sauvegarde."; exit 1; }
          done
          ls -l "$RUNNER_TEMP/backup/tinkattout.dump"

      - name: Chiffrer (gpg AES-256)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          passfile="$RUNNER_TEMP/passphrase"
          printf '%s' "$BACKUP_PASSPHRASE" > "$passfile"
          enc="$out/tinkattout-${stamp}.dump.gpg"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passfile" \
            --symmetric --cipher-algo AES256 \
            --output "$enc" "$RUNNER_TEMP/backup/tinkattout.dump"
          # Contrôle : le fichier chiffré se déchiffre et redonne exactement la sauvegarde.
          gpg --batch --quiet --pinentry-mode loopback --passphrase-file "$passfile" \
            --decrypt "$enc" | cmp - "$RUNNER_TEMP/backup/tinkattout.dump"
          (cd "$out" && sha256sum "$(basename "$enc")" > "$(basename "$enc").sha256")
          # Rien de lisible ne doit rester sur la machine.
          rm -f "$passfile" "$RUNNER_TEMP/backup/tinkattout.dump"
          echo "STAMP=${stamp}" >> "$GITHUB_ENV"
          ls -l "$out"

      - name: Déposer l'artefact (30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
          if-no-files-found: error
